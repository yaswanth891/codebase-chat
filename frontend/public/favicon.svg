<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5" />
  
  <!-- Subtle Inner Grid / Tech Accent -->
  <circle cx="32" cy="32" r="22" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Left Bracket < -->
  <path d="M22 22 L13 32 L22 42" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Center Slash / -->
  <path d="M36 19 L28 45" stroke="url(#slashGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Right Bracket > -->
  <path d="M42 22 L51 32 L42 42" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Status Dot Accent -->
  <circle cx="48" cy="16" r="3.5" fill="#38bdf8" />
</svg>
